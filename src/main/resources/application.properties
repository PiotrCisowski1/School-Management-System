spring.application.name=schoolmanagement

spring.security.user.name=admin
spring.security.user.password=admin

spring.output.ansi.enabled=ALWAYS

#DATABASE CONNECTION
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=School_Management;encrypt=true;trustServerCertificate=true;
spring.datasource.username=school_mgmt
spring.datasource.password=school_mgmt
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

#HIBERNATE
spring.jpa.hibernate.ddl-auto=none


#LOG
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.boot.autoconfigure=ERROR
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

lombok.addLombokGeneratedAnnotation = true

server.error.include-message=always


