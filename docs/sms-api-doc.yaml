openapi: 3.0.1
info:
  title: School Management System API
  version: "1.3.3"
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Parents
  description: "Operations related to parental accounts, including student-parent\
    \ linking and access to children's academic progress."
- name: Schedules
  description: "Core engine for school time management. Handles lesson occurrences,\
    \ class cancellations etc."
- name: Teachers
  description: "Administration of teaching staff, including professional profiles,\
    \ subject specializations, and departmental affiliations."
- name: Schedule Occurrences
  description: "Management of specific lesson instances. Handles individual session\
    \ details, substitutions, and real-time schedule updates."
- name: Grades
  description: "Management of student academic performance, including grade assignment,\
    \ grade types, and grading scales."
- name: Subjects
  description: "Management of the school curriculum, including subject definitions,\
    \ department assignments, and subject-specific configurations."
- name: Yearbooks
  description: Administration of academic years (yearbooks). Defines the time-frame
    and organizational structure for students.
- name: App Config
  description: Management of global application parameters and environment-specific
    settings.
- name: Attendance
  description: Tracking and reporting student presence. Manages absence records and
    attendance summaries. Attendance is linked to schedule occurrence and student.
    Attendance is automatically initialized X minutes before occurrence starts - configured
    in application configuration
- name: Authentication
  description: Secure entry point for users. Handles identity verification and issues
    JWT Bearer tokens.
- name: Students
  description: "Comprehensive student data management, including enrollment details,\
    \ class assignments, and personal profiles."
- name: Classroom
  description: Management of Classroom
paths:
  /schedules/{scheduleId}/CANCEL:
    put:
      tags:
      - Schedules
      summary: Cancel schedule
      description: "Cancel booked schedule and all it's occurrences. Required authority\
        \ level: Administrator"
      operationId: cancelSchedule
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 200
              minLength: 3
              type: string
        required: true
      responses:
        "404":
          description: Schedule not found
          content:
            '*/*':
              schema:
                type: string
        "204":
          description: Canceled successfully
          content:
            '*/*':
              schema:
                type: string
        "401":
          description: Full authentication is required to access this resource
        "406":
          description: Cancellation not possible because of schedule's status
          content:
            '*/*':
              schema:
                type: string
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
  /yearbooks:
    get:
      tags:
      - Yearbooks
      summary: Find all yearbooks
      description: "Retrieves all existing yearbooks in the system. Required authority\
        \ level: Administrator"
      operationId: getYearbooks
      responses:
        "401":
          description: Full authentication is required to access this resource
        "200":
          description: Returns existing yearbooks list (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YearbookSummaryResponse'
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Yearbooks
      summary: Create yearbook
      description: "Adds new yearbook with unique symbol. Required authority level:\
        \ Administrator"
      operationId: addYearbook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddYearbookRequest'
        required: true
      responses:
        "406":
          description: Subject not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/YearbookDetailedResponse'
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/YearbookDetailedResponse'
        "404":
          description: Head teacher not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/YearbookDetailedResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
        "409":
          description: Already exists for symbol or head teacher
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/YearbookDetailedResponse'
      security:
      - bearerAuth: []
  /token/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh token
      description: Generate new token to authorize across the system. Requires already
        authenticated user.
      operationId: refreshToken
      responses:
        "403":
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "200":
          description: Returns newly generated token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Full authentication is required to access this resource
      security:
      - bearerAuth: []
  /teachers:
    get:
      tags:
      - Teachers
      summary: Find all teachers
      description: "Retrieves all existing teachers in the system. Required authority\
        \ level: Administrator"
      operationId: getTeachers
      responses:
        "200":
          description: Returns existing teachers list (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherSummaryResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Teachers
      summary: Create teacher
      description: "Adds new Teacher profile. Required authority level: Administrator"
      operationId: addTeacher
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherCreateRequest'
        required: true
      responses:
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddTeacherResponse'
        "404":
          description: Authority not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddTeacherResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
        "409":
          description: User with given email already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddTeacherResponse'
      security:
      - bearerAuth: []
  /teachers/{teacherId}/teacher-availability:
    get:
      tags:
      - Teachers
      summary: Get all availabilities for Teacher
      description: "Retrieves all existing availabilities for particular teacher.\
        \ Required authority level: Administrator, Teacher"
      operationId: getTeacherAvailabilityByTeacherId
      parameters:
      - name: teacherId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Returns existing availabilities list (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherAvailabilityResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Teachers
      summary: Create teacher's availability
      description: "Adds teacher availability record which represents teacher's possibility\
        \ to teach a lesson in particular time range. Required authority level: Administrator,\
        \ Teacher"
      operationId: addTeacherAvailability
      parameters:
      - name: teacherId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherAvailabilityRequest'
        required: true
      responses:
        "404":
          description: Teacher not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeacherAvailabilityResponse'
        "406":
          description: Availability already booked for given teacher
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeacherAvailabilityResponse'
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeacherAvailabilityResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
  /subjects:
    get:
      tags:
      - Subjects
      summary: Find all subjects
      description: "Retrieves all existing subjects in the system. Required authority\
        \ level: Administrator"
      operationId: getAllSubjects
      responses:
        "200":
          description: Returns object list (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectSummaryResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Subjects
      summary: Create subject
      description: "Adds new subject with unique subject code. Required authority\
        \ level: Administrator"
      operationId: addSubject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubjectRequest'
        required: true
      responses:
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubjectDetailedResponse'
        "401":
          description: Full authentication is required to access this resource
        "409":
          description: Object with given subject code already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubjectDetailedResponse'
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
  /subjects/subjectTypes:
    get:
      tags:
      - Subjects
      summary: Find all subject types
      description: "Retrieves all existing subject types in the system. Required authority\
        \ level: Administrator"
      operationId: getAllSubjectType
      responses:
        "401":
          description: Full authentication is required to access this resource
        "200":
          description: Returns existing objects (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectTypeResponse'
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Subjects
      summary: Create subject type
      description: "Adds new subject type with unique name. Required authority level:\
        \ Administrator"
      operationId: addSubjectType
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectTypeRequest'
        required: true
      responses:
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubjectTypeResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
        "409":
          description: Object with given name already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubjectTypeResponse'
      security:
      - bearerAuth: []
  /students:
    get:
      tags:
      - Students
      summary: Find all students
      description: "Retrieves all existing students in the system. Required authority\
        \ level: Administrator"
      operationId: getStudents
      responses:
        "200":
          description: Returns existing students list (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSummaryResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Students
      summary: Create student
      description: "Adds new student profile to the system. Required authority level:\
        \ Administrator"
      operationId: addStudent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
        required: true
      responses:
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddStudentResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
        "406":
          description: Authority with given ID not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddStudentResponse'
        "409":
          description: User with given email already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddStudentResponse'
      security:
      - bearerAuth: []
  /schedules/version:
    post:
      tags:
      - Schedules
      summary: Create schedule version
      description: "Adds new schedule version representing lesson plan for particular\
        \ period of time associated with particular yearbook. Required authority level:\
        \ Administrator"
      operationId: createScheduleVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddScheduleVersionRequest'
        required: true
      responses:
        "201":
          description: Successfully created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "401":
          description: Full authentication is required to access this resource
        "404":
          description: Yearbook not found by ID
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
  /schedules/version/{scheduleVersionId}:
    get:
      tags:
      - Schedules
      summary: Get schedule version by ID
      description: "Retrieves existing schedule version for given ID. Required authority\
        \ level: Administrator, Teacher, Student"
      operationId: getScheduleVersionsForId
      parameters:
      - name: scheduleVersionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "401":
          description: Full authentication is required to access this resource
        "200":
          description: Returns existing schedule version
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "406":
          description: Schedule version already marked as removed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "403":
          description: User lacks permission to access this resource
        "404":
          description: Schedule version not found for given ID
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Schedules
      summary: Create new schedule
      description: "Adds new schedule representing recurrent lesson unit applicable\
        \ in a given time period. Required authority level: Administrator"
      operationId: addSchedule
      parameters:
      - name: scheduleVersionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddScheduleRequest'
        required: true
      responses:
        "404":
          description: Schedule version not found by ID
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleDetailedResponse'
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleDetailedResponse'
        "401":
          description: Full authentication is required to access this resource
        "406":
          description: Teacher not available in a given time period
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleDetailedResponse'
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    delete:
      tags:
      - Schedules
      summary: Delete schedule version
      description: "Remove existing schedule version with given ID, if not already\
        \ marked as removed. Required authority level: Administrator"
      operationId: deleteScheduleVersion
      parameters:
      - name: scheduleVersionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Removed successfully
          content:
            '*/*':
              schema:
                type: string
        "401":
          description: Full authentication is required to access this resource
        "406":
          description: Schedule version already marked as removed
          content:
            '*/*':
              schema:
                type: string
        "403":
          description: User lacks permission to access this resource
        "404":
          description: Not found by ID
          content:
            '*/*':
              schema:
                type: string
      security:
      - bearerAuth: []
    patch:
      tags:
      - Schedules
      summary: Update schedule version
      description: "Modify existing schedule version. Required authority level: Administrator"
      operationId: patchScheduleVersion
      parameters:
      - name: scheduleVersionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchScheduleVersionRequest'
        required: true
      responses:
        "401":
          description: Full authentication is required to access this resource
        "404":
          description: Schedule version not found by ID
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "200":
          description: Modified successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
  /schedules/version/{scheduleVersionId}/clone:
    post:
      tags:
      - Schedules
      summary: Clone schedule version
      description: "Creates new schedule version based on date in cloned version with\
        \ all schedules, that is set to unactive by default. Required authority level:\
        \ Administrator"
      operationId: cloneScheduleVersion
      parameters:
      - name: scheduleVersionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          description: Schedule version to clone not found by ID
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "201":
          description: Successfully created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
        "406":
          description: Schedule version to clone is already marked as removed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScheduleVersionDetailedResponse'
      security:
      - bearerAuth: []
  /scheduleOccurrence/{scheduleOccurrenceId}/mark:
    post:
      tags:
      - Attendance
      summary: Set attendance status for students
      description: "Mark attendance for given students with particular status. Required\
        \ authority level: Administrator, Teacher"
      operationId: setAttendanceAbsenceStatusForStudents
      parameters:
      - name: scheduleOccurrenceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAttendanceRequest'
        required: true
      responses:
        "200":
          description: Marked successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceSummaryResponse'
        "404":
          description: Student not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceSummaryResponse'
        "406":
          description: Marking attendance status for occurrence with invalid status
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceSummaryResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
  /parents:
    get:
      tags:
      - Parents
      summary: Find all parents
      description: "Retrieve all existing parents in the system. Required authority\
        \ level: Administrator"
      operationId: getParents
      responses:
        "200":
          description: Returns existing objects list (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParentSummaryResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Parents
      summary: Create parent
      description: "Adds new parent profile related with children. Response includes\
        \ first generated password. Required authority level: Administrator"
      operationId: addParent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentCreateRequest'
        required: true
      responses:
        "201":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddParentResponse'
        "401":
          description: Full authentication is required to access this resource
        "404":
          description: Children not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddParentResponse'
        "403":
          description: User lacks permission to access this resource
        "406":
          description: Authority with given ID not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddParentResponse'
        "409":
          description: User with given email already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddParentResponse'
      security:
      - bearerAuth: []
  /login:
    post:
      tags:
      - Authentication
      summary: Login to the system
      description: Authenticates user with given credentials and generates token to
        authorize across the system.
      operationId: authenticate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
        required: true
      responses:
        "404":
          description: User with given email not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "200":
          description: User authenticated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /grades:
    post:
      tags:
      - Grades
      summary: Create grade
      description: "Adds new grade for Student by Teacher, related with Subject, with\
        \ particular value and type. Required authority level: Administrator, Teacher"
      operationId: addGrade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGradeRequest'
        required: true
      responses:
        "404":
          description: Grade value not found by ID
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GradeDetailedResponse'
        "406":
          description: Student not attending Subject
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GradeDetailedResponse'
        "401":
          description: Full authentication is required to access this resource
        "200":
          description: Created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GradeDetailedResponse'
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
  /grades/types:
    get:
      tags:
      - Grades
      summary: Get all grade types
      description: "Retrieves all existing grade types in the system. Required authority\
        \ level: Administrator"
      operationId: getGradeTypes
      responses:
        "200":
          description: Returns found objects (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeTypeResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Grades
      summary: Create grade type
      description: "Adds new grade type to the system, describing scope and significance\
        \ of grade. Required authority level: Administrator"
      operationId: addGradeType
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGradeTypeRequest'
        required: true
      responses:
        "406":
          description: Grade type already exists by given grade scope
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GradeTypeResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
        "201":
          description: Grade type created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GradeTypeResponse'
      security:
      - bearerAuth: []
  /grades/scales:
    get:
      tags:
      - Grades
      summary: Get all grade scales
      description: "Retrieves list of existing grade scales. Required authority level:\
        \ Administrator"
      operationId: getAllGradeScales
      responses:
        "200":
          description: Returns exiting grade scales (empty result as well)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeScaleSummaryResponse'
        "401":
          description: Full authentication is required to access this resource
        "403":
          description: User lacks permission to access this resource
      security:
      - bearerAuth: []
    post:
      tags:
      - Grades
      summary: Create new grade scale
      description: "Adds new grade scale, which represents possible grade values used\
        \ by all Teachers. Required authority level: Administrator"
      operationId: addGradeScale
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeScaleRequest'
